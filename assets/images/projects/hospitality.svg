<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Modelo web para hosterías</title>
  <desc id="desc">Vista conceptual de un sitio web moderno para una hostería con habitaciones, reservas y servicios.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a31"/>
      <stop offset="1" stop-color="#0f5570"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8eef0"/>
      <stop offset="1" stop-color="#8bc7c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00101f" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="230" fill="#18b7aa" opacity=".11"/>
  <circle cx="135" cy="735" r="210" fill="#2479ff" opacity=".12"/>

  <g filter="url(#shadow)">
    <rect x="115" y="92" width="970" height="616" rx="30" fill="#f8fbfd"/>
    <rect x="115" y="92" width="970" height="74" rx="30" fill="#ffffff"/>
    <rect x="115" y="137" width="970" height="29" fill="#ffffff"/>
    <circle cx="155" cy="129" r="8" fill="#d8e2ea"/>
    <circle cx="181" cy="129" r="8" fill="#d8e2ea"/>
    <circle cx="207" cy="129" r="8" fill="#d8e2ea"/>
    <rect x="255" y="116" width="235" height="26" rx="13" fill="#eef3f7"/>
    <text x="279" y="135" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#15344d">Hostería Castillo Real</text>
    <text x="720" y="134" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#546b7e">Habitaciones</text>
    <text x="825" y="134" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#546b7e">Servicios</text>
    <rect x="925" y="112" width="120" height="34" rx="17" fill="#1477ff"/>
    <text x="948" y="134" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Reservar</text>

    <rect x="143" y="190" width="914" height="250" rx="24" fill="url(#hero)"/>
    <path d="M143 370 C300 295 420 325 565 270 C710 215 845 255 1057 190 L1057 440 L143 440 Z" fill="#376d66" opacity=".32"/>
    <path d="M143 410 C310 330 505 380 650 320 C820 250 930 300 1057 260 L1057 440 L143 440 Z" fill="#1c4b4e" opacity=".38"/>
    <rect x="190" y="234" width="405" height="142" rx="20" fill="#ffffff" opacity=".93"/>
    <text x="225" y="274" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#1477ff">DESCANSA · DISFRUTA · CONECTA</text>
    <text x="225" y="316" font-family="Manrope, Arial, sans-serif" font-size="34" font-weight="800" fill="#102238">Una experiencia para</text>
    <text x="225" y="353" font-family="Manrope, Arial, sans-serif" font-size="34" font-weight="800" fill="#102238">recordar.</text>

    <text x="150" y="490" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#102238">Habitaciones y servicios</text>
    <g>
      <rect x="150" y="520" width="270" height="142" rx="18" fill="#ffffff" stroke="#dce6ed"/>
      <rect x="168" y="538" width="92" height="106" rx="14" fill="#d9e9e7"/>
      <path d="M177 617 L208 579 L230 601 L250 570 L260 644 L168 644 Z" fill="#78aaa5"/>
      <text x="280" y="566" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#15344d">Suite familiar</text>
      <text x="280" y="590" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6a7d8d">Comodidad y descanso</text>
      <rect x="280" y="612" width="80" height="24" rx="12" fill="#eef5ff"/>
      <text x="296" y="629" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#1477ff">Ver más</text>
    </g>
    <g>
      <rect x="445" y="520" width="270" height="142" rx="18" fill="#ffffff" stroke="#dce6ed"/>
      <circle cx="495" cy="571" r="28" fill="#dff6f1"/>
      <path d="M476 577 Q495 549 514 577" fill="none" stroke="#17a58e" stroke-width="7" stroke-linecap="round"/>
      <text x="535" y="566" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#15344d">Piscina y descanso</text>
      <text x="535" y="590" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6a7d8d">Servicios para huéspedes</text>
      <rect x="535" y="612" width="80" height="24" rx="12" fill="#eef8f6"/>
      <text x="551" y="629" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#138d78">Explorar</text>
    </g>
    <g>
      <rect x="740" y="520" width="270" height="142" rx="18" fill="#ffffff" stroke="#dce6ed"/>
      <circle cx="790" cy="571" r="28" fill="#fff4dc"/>
      <path d="M776 580 h28 M780 570 h20 M785 560 h10" stroke="#c48718" stroke-width="5" stroke-linecap="round"/>
      <text x="830" y="566" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#15344d">Restaurante</text>
      <text x="830" y="590" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6a7d8d">Gastronomía y eventos</text>
      <rect x="830" y="612" width="80" height="24" rx="12" fill="#fff7e7"/>
      <text x="846" y="629" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#a66c08">Conocer</text>
    </g>
  </g>

  <g transform="translate(840 610)" filter="url(#shadow)">
    <rect width="210" height="132" rx="22" fill="#0b263d"/>
    <circle cx="42" cy="45" r="22" fill="#12b99f"/>
    <path d="M31 45 l8 8 15 -18" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="41" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff">Demo adaptable</text>
    <text x="75" y="60" font-family="Inter, Arial, sans-serif" font-size="10" fill="#bdd2df">Marca · contenido · dominio</text>
    <rect x="26" y="86" width="158" height="28" rx="14" fill="#1477ff"/>
    <text x="57" y="105" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Modelo AppNexo</text>
  </g>
</svg>